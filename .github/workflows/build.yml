name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the games to WebAssembly
        run: bash web/build.sh
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium-headless-shell
      - name: Browser smoke test (plays every game in headless Chromium)
        run: node web/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: web/smoke-*.png
